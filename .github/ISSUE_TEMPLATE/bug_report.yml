name: Bug report
description: Something behaves differently from what it documents
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest set of steps that shows the problem.
      placeholder: |
        1. cargo new --lib crates/foo
        2. just ci
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the real error. Rendered as a code block, no backticks needed.
      render: text
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Toolchain
      description: Output of `rustc --version`.
      placeholder: rustc 1.98.1 (abcdef123 2026-09-03)
    validations:
      required: true

  - type: dropdown
    id: gate
    attributes:
      label: Which gate is involved, if any
      options:
        - "Not gate-related"
        - "fmt"
        - "clippy"
        - "test"
        - "deny"
        - "MSRV job"
        - "Docker build"
    validations:
      required: false
