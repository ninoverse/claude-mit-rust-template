name: Feature request
description: Propose something this template should ship
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: >
        Describe the problem, not the solution. This template biases toward
        simplicity — anything speculative is likely to be declined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: Including doing nothing.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This belongs in every project cloned from the template, not just mine
          required: false
