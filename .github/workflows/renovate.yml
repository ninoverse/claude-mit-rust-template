name: Renovate

# Self-hosted: Renovate runs here, on this repository's own Actions minutes,
# instead of installing the Mend GitHub App. Nothing outside this repo is given
# write access, and there is no third-party service in the loop.
#
# Requires a RENOVATE_TOKEN secret — see CONTRIBUTING.md. GITHUB_TOKEN will not
# do: pull requests opened with it deliberately do not trigger other workflows,
# so CI would never run on a dependency PR, which is the one thing that makes
# these safe to merge.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, ahead of the audit job at 06:00
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without creating branches, PRs or issues"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
  # Re-run when the config changes, so a mistake surfaces immediately rather
  # than next Monday.
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::error::RENOVATE_TOKEN is not set. See CONTRIBUTING.md for the scopes it needs."
            exit 1
          fi

      # dryRun is an enum (extract | lookup | full), not a boolean, and there is
      # no way to express "unset" from an `env:` expression — it would resolve
      # to an empty string, which is not a valid value. So set it only when it
      # is actually wanted.
      - name: Enable dry run
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # The action and the tool it runs are versioned independently: this action
      # is v46, while Renovate itself is at 44.x. Left alone the action supplies
      # its own default (a floating major), so the version actually doing the
      # work is invisible here and changes without a diff. Pinning it exactly
      # makes it reviewable; the annotation below is what lets Renovate keep the
      # pin current, via the customManager in renovate.json.
      - uses: renovatebot/github-action@v46.2.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.66.1
        env:
          # Only this repository. Without it Renovate autodiscovers every repo
          # the token can reach, which is far more than intended.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
